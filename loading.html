<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline';" />
  <title>DeepSeek Harness</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f4f7fc;
      color: #1f2937;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 34px 42px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(99, 116, 150, 0.14);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(70, 95, 140, 0.14);
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 19px;
      box-shadow: 0 10px 24px rgba(65, 105, 180, 0.18);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #dce6f5;
      border-top-color: #4c8dff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .text {
      font-size: 14px;
      letter-spacing: 0.3px;
      color: #5b6678;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/icon.png" alt="DeepSeek Harness" />
    <div class="spinner"></div>
    <div class="text">正在启动 DeepSeek Harness…</div>
  </div>
</body>
</html>
