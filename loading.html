<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline';" />
  <title>DeepSeek Harness</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f4f7fc;
      color: #1f2937;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding: 34px 42px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px solid rgba(99, 116, 150, 0.14);
      border-radius: 22px;
      box-shadow: 0 18px 48px rgba(70, 95, 140, 0.14);
      animation: rise 0.28s ease both;
    }
    .logo {
      width: 84px;
      height: 84px;
      border-radius: 19px;
      box-shadow: 0 10px 24px rgba(65, 105, 180, 0.18);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #dce6f5;
      border-top-color: #4c8dff;
      border-radius: 50%;
      animation: spin 0.85s linear infinite;
    }
    .text {
      font-size: 14px;
      letter-spacing: 0.3px;
      color: #5b6678;
    }
    .detail {
      display: none;
      max-width: 560px;
      max-height: 180px;
      overflow: auto;
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #64748b;
      font: 12px/1.55 Consolas, monospace;
      text-align: left;
      white-space: pre-wrap;
      user-select: text;
    }
    .actions { display: none; gap: 10px; }
    button {
      padding: 8px 18px;
      border: 0;
      border-radius: 9px;
      background: #4c8dff;
      color: white;
      font: 14px "Segoe UI", "Microsoft YaHei", sans-serif;
      cursor: pointer;
    }
    button.secondary { background: #e2e8f0; color: #475569; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px) scale(0.985); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="assets/icon.png" alt="DeepSeek Harness" />
    <div class="spinner"></div>
    <div class="text" id="status">正在启动 DeepSeek Harness…</div>
    <pre class="detail" id="detail"></pre>
    <div class="actions" id="actions">
      <button id="retry">重试启动</button>
      <button class="secondary" id="quit">退出</button>
    </div>
  </div>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var reason = params.get("reason");
      if (reason === "restart") {
        document.getElementById("status").textContent = "正在重启 DeepSeek Harness…";
      } else if (reason === "error") {
        document.querySelector(".spinner").style.display = "none";
        document.getElementById("status").textContent = params.get("title") || "启动失败";
        var detail = document.getElementById("detail");
        detail.textContent = params.get("detail") || "请检查 dsh 是否已正确安装。";
        detail.style.display = "block";
        document.getElementById("actions").style.display = "flex";
        document.getElementById("retry").addEventListener("click", function () {
          window.__dshShell.retryBoot();
        });
        document.getElementById("quit").addEventListener("click", function () {
          window.__dshShell.quit();
        });
      }
    })();
  </script>
</body>
</html>
